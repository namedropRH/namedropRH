<svg width="900" height="392" viewBox="0 0 900 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vault lifecycle from X account id to claim">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      .t{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .h{fill:#e6edf3;font-size:19px;font-weight:700;letter-spacing:.08em}
      .s{fill:#8b949e;font-size:12.5px}
      .k{fill:#e6edf3;font-size:14px;font-weight:600}
      .n{fill:#484f58;font-size:11px;font-weight:700}
    </style>
  </defs>
  <rect width="900" height="392" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="390" rx="13" fill="none" stroke="#30363d"/>

  <text x="450" y="44" text-anchor="middle" class="t h">ONE VAULT PER X ACCOUNT</text>
  <text x="450" y="66" text-anchor="middle" class="t s">the address exists before the vault does</text>

  <rect x="40" y="96" width="186" height="78" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="54" y="118" class="t n">01</text>
  <text x="54" y="139" class="t k">handleId</text>
  <text x="54" y="160" class="t s">the X numeric id, not @handle</text>

  <line x1="226" y1="135" x2="266" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#b)"/>

  <rect x="274" y="96" width="186" height="78" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="288" y="118" class="t n">02</text>
  <text x="288" y="139" class="t k">CREATE2 predict</text>
  <text x="288" y="160" class="t s">address known before deploy</text>

  <line x1="460" y1="135" x2="500" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#b)"/>

  <rect x="508" y="96" width="186" height="78" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="522" y="118" class="t n">03</text>
  <text x="522" y="139" class="t k">launch names it</text>
  <text x="522" y="160" class="t s">creatorFeeRecipient = vault</text>

  <line x1="694" y1="135" x2="734" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#b)"/>

  <rect x="742" y="96" width="118" height="78" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="756" y="118" class="t n">04</text>
  <text x="756" y="139" class="t k">trading</text>
  <text x="756" y="160" class="t s">3% accrues</text>

  <path d="M801 174 L801 202 L99 202 L99 228" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#b)"/>

  <rect x="40" y="236" width="186" height="82" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="54" y="258" class="t n">05</text>
  <text x="54" y="279" class="m k">pull()</text>
  <text x="54" y="300" class="t s">permissionless, batched</text>

  <line x1="226" y1="277" x2="266" y2="277" stroke="#8b949e" stroke-width="1.5" marker-end="url(#b)"/>

  <rect x="274" y="236" width="186" height="82" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="288" y="258" class="t n">06</text>
  <text x="288" y="279" class="t k">80% credited</text>
  <text x="288" y="300" class="t s">20% to treasury, same tx</text>

  <line x1="460" y1="277" x2="500" y2="277" stroke="#8b949e" stroke-width="1.5" marker-end="url(#b)"/>

  <rect x="508" y="236" width="186" height="82" rx="10" fill="#161b22" stroke="#d29922"/>
  <text x="522" y="258" class="t n">07</text>
  <text x="522" y="279" class="t k">bind, 48h in public</text>
  <text x="522" y="300" class="t s">the one trusted step</text>

  <line x1="694" y1="277" x2="734" y2="277" stroke="#8b949e" stroke-width="1.5" marker-end="url(#b)"/>

  <rect x="742" y="236" width="118" height="82" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="756" y="258" class="t n">08</text>
  <text x="756" y="279" class="m k">claim()</text>
  <text x="756" y="300" class="t s">or push()</text>

  <text x="450" y="356" text-anchor="middle" class="t s">If the account never signs, the balance stays where it is. There is no expiry and no admin exit.</text>
</svg>
