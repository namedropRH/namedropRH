[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

# Robinhood Chain, id 4663 (Arbitrum Orbit, ETH gas).
[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
